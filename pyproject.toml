[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jatibarang-ccus-framework"
version = "0.1.0"
description = "Phase 1 paper-number framework for a Jatibarang-anchored CO2 HnP CCUS study."
requires-python = ">=3.11"
dependencies = [
  "CoolProp>=7.2",
  "fastapi>=0.115",
  "networkx>=3.0",
  "numpy>=1.24",
  "pydantic>=2.0",
  "pyomo>=6.10",
  "pyproj>=3.7",
  "rasterio>=1.5",
  "shapely>=2.0",
  "torch>=2.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
  "h5py>=3.10",
  "httpx>=0.27",
  "jsonschema>=4.22",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "pytest>=8.0",
]
validation = [
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
