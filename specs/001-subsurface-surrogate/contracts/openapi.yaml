openapi: 3.1.0
info:
  title: Jatibarang CCUS Surrogate API
  version: 0.1.0
paths:
  /model/info:
    get:
      summary: Report the promoted model contract and evidence
      responses:
        '200': {description: Model metadata}
  /predict:
    post:
      summary: Run one detailed warm-start surrogate forecast
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PredictRequest'}
      responses:
        '200': {description: Detailed prediction}
        '422': {description: Invalid physical or structural input}
  /predict/batch:
    post:
      summary: Run 1-256 compact warm-start forecasts
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BatchPredictRequest'}
      responses:
        '200': {description: Compact results plus selected full fields}
        '422': {description: 'Invalid registry, scenario, or selection'}
components:
  schemas:
    PredictRequest:
      type: object
      required: [scenario_id, geology, schedule, seed]
      properties:
        scenario_id: {type: string, minLength: 1}
        geology: {type: object}
        schedule: {type: object}
        seed: {type: object}
    BatchPredictRequest:
      type: object
      required: [geologies, seeds, scenarios]
      properties:
        geologies: {type: object, additionalProperties: {type: object}}
        seeds: {type: object, additionalProperties: {type: object}}
        scenarios:
          type: array
          minItems: 1
          maxItems: 256
          items: {type: object}
        full_field_scenario_ids:
          type: array
          maxItems: 10
          items: {type: string}
